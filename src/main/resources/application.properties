spring.application.name=web_crawler

# Server
server.port=8081

# PostgreSQL - local database "crawler_db"
# R2DBC is used for reactive runtime access (non-blocking, WebFlux-compatible).
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/crawler_db
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:postgres}

# Flyway uses a JDBC connection only at startup to run migrations,
# since Flyway does not support R2DBC. The application itself never
# uses JDBC at runtime.
spring.flyway.url=jdbc:postgresql://localhost:5432/crawler_db
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:postgres}

# Hacker News scraper
hackernews.base-url=${HACKERNEWS_BASE_URL:https://news.ycombinator.com/}
hackernews.timeout=${HACKERNEWS_TIMEOUT:5s}
